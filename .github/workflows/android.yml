name: Build Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake autopoint gettext \
            libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Restore debug signing key for APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: guitarcraft-debug-keystore-v1

      - name: Create debug signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Install Android build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-android.txt
          python -m pip install pygame==2.6.1

      - name: Validate Python source
        run: python -m py_compile main.py game_logic.py microphone.py instructions.py

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v

      - name: Build debug APK
        run: |
          set +o pipefail
          yes | buildozer -v android debug

      - name: Apply stable debug signature
        run: bash tools/sign_android.sh bin/*.apk

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test APK startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash tools/smoke_android.sh bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuitarCraft-Android-debug
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: GuitarCraft-Android-screen
          path: ${{ runner.temp }}/guitarcraft-screen.png
          if-no-files-found: error
