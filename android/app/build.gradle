plugins {
    id 'com.android.application'
}

android {
    namespace 'org.game.guitarcraft'
    compileSdk 35

    defaultConfig {
        applicationId 'org.game.guitarcraft'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir(layout.buildDirectory.dir('generated/web-assets'))
        }
    }
}

def syncWebAssets = tasks.register('syncWebAssets', Copy) {
    from(file("$rootDir/../dist")) {
        exclude '**/*.md'
    }
    into(layout.buildDirectory.dir('generated/web-assets/www'))
}

tasks.named('preBuild') {
    dependsOn(syncWebAssets)
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}
